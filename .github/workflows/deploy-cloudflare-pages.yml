name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Cloudflare Pages
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare static assets
        run: |
          mkdir -p dist
          cp index.html styles.css game.js levels.js dist/
          cp *.png dist/
          cp -r functions dist/

      - name: Create Pages project if needed
        uses: cloudflare/wrangler-action@v3
        continue-on-error: true
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 429992301013199ba21521115242405c
          command: pages project create shipping-game --production-branch=main

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 429992301013199ba21521115242405c
          command: pages deploy dist --project-name=shipping-game --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
