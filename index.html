<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>川渡りパズル</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="game-shell" aria-live="polite">
      <header class="topbar">
        <div>
          <p class="eyebrow">River Crossing</p>
          <h1>川渡りパズル</h1>
        </div>
        <button class="icon-button" id="resetButton" type="button" aria-label="リセット">
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="M3 12a9 9 0 1 0 3-6.7" />
            <path d="M3 4v6h6" />
          </svg>
        </button>
      </header>

      <section class="status-strip">
        <div>
          <span class="label">移動回数</span>
          <strong id="moveCount">0</strong>
        </div>
        <div>
          <span class="label">舟の場所</span>
          <strong id="boatSideText">左岸</strong>
        </div>
        <div>
          <span class="label">選択中</span>
          <strong id="selectionCount">0 / 2</strong>
        </div>
      </section>

      <section class="board" aria-label="川渡りゲーム盤">
        <div class="bank bank-left" data-side="left">
          <div class="bank-header">
            <span>左岸</span>
            <small id="leftCount">8人</small>
          </div>
          <div class="people-grid" id="leftPeople"></div>
        </div>

        <div class="river">
          <div class="water-lines"></div>
          <div class="boat" id="boatButton" role="button" tabindex="0" aria-label="舟を動かす">
            <span class="boat-passengers" id="boatPassengers"></span>
            <span class="boat-body" aria-hidden="true">
              <span class="boat-bench boat-bench-front"></span>
              <span class="boat-bench boat-bench-back"></span>
              <span class="boat-keel"></span>
            </span>
            <span class="boat-oar boat-oar-left" aria-hidden="true"></span>
            <span class="boat-oar boat-oar-right" aria-hidden="true"></span>
            <span class="boat-ripple"></span>
          </div>
        </div>

        <div class="bank bank-right" data-side="right">
          <div class="bank-header">
            <span>右岸</span>
            <small id="rightCount">0人</small>
          </div>
          <div class="people-grid" id="rightPeople"></div>
        </div>
      </section>

      <section class="controls">
        <button class="primary-action" id="crossButton" type="button">
          <svg class="cross-arrow" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M5 12h14" />
            <path d="m13 6 6 6-6 6" />
          </svg>
          <span>渡る</span>
        </button>
        <button class="secondary-action" id="clearButton" type="button">船を降りる</button>
      </section>

      <section class="rule-panel" aria-label="ルール">
        <button class="rule-toggle" id="ruleToggle" type="button" aria-expanded="false">
          <span>ルール</span>
          <svg aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 9 6 6 6-6" />
          </svg>
        </button>
        <div class="rules" id="rules">
          <p>舟は1人か2人で移動できます。父、母、召使いだけが舟をこげます。</p>
          <p>父は、母がいない場所で娘を怒ります。母は、父がいない場所で息子を怒ります。</p>
          <p>犬は召使いがいない場所では、家族の誰とも一緒に過ごすことはできません。</p>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="assertive"></div>

    <dialog class="win-dialog" id="winDialog">
      <div class="win-card">
        <p class="eyebrow">Clear</p>
        <h2>全員、右岸に到着しました</h2>
        <p><span id="finalMoves">0</span>手でクリアです。</p>
        <button class="primary-action" id="playAgainButton" type="button">もう一度</button>
      </div>
    </dialog>

    <script src="game.js"></script>
  </body>
</html>
